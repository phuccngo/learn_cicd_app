  name: CI/CD Pipeline

  on:
    push:
      branches: [ main, develop ]
    pull_request:
      branches: [ main ]
    schedule:
      - cron: '0 3 * * 0'   # Chạy dọn dẹp image cũ mỗi Chủ nhật lúc 3h sáng UTC
    workflow_dispatch:
      inputs:
        os:
          description: 'OS to deploy to'
          required: true
          default: 'ubuntu'
          type: choice
          options:
            - ubuntu-latest
            - macos-latest
            - windows-latest
        node-version:
          required: false
          type: string
          description: 'Node.js version to use for deployment'

  env:
    NODE_VERSION: '18'
    DOCKER_REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

  # Cần quyền write để push image và xóa version cũ trên GHCR
  permissions:
    contents: read
    packages: write

  jobs:
    # ---------------------------------------------------------
    # Build, Test và Push image lên Registry (chỉ 1 lần duy nhất)
    # ---------------------------------------------------------
    # build-and-test:
    #   runs-on: ubuntu-latest
    #   outputs:
    #     image-tag: ${{ steps.meta.outputs.tag }}
    #   steps:
    #     - name: Checkout code
    #       uses: actions/checkout@v3

    #     - name: Setup Node.js
    #       uses: actions/setup-node@v3
    #       with:
    #         node-version: ${{ matrix.node-version }}
    #         cache: 'npm'

    #     - name: Install dependencies
    #       run: npm ci

    #     - name: Run linting
    #       run: npm run lint

    #     - name: Run unit tests
    #       run: npm run test:unit

    #     - name: Run integration tests
    #       run: npm run test:integration

    #     - name: Generate coverage report
    #       run: npm run test -- --coverage

    #     - name: Upload coverage to Codecov
    #       uses: codecov/codecov-action@v3
    #       with:
    #         file: ./coverage/lcov.info

    #     - name: Security audit
    #       run: npm audit --audit-level moderate

    #     - name: Set image tag
    #       id: meta
    #       run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

    #     - name: Build Docker image
    #       run: |
    #         docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

    #     - name: Test Docker image
    #       run: |
    #         docker run --rm -d -p 3000:3000 --name test-container ${{ env.IMAGE_NAME }}:${{ github.sha }}
    #         sleep 10
    #         curl -f http://localhost:3000/health
    #         docker stop test-container

    #     - name: Login to GitHub Container Registry
    #       uses: docker/login-action@v2
    #       with:
    #         registry: ${{ env.DOCKER_REGISTRY }}
    #         username: ${{ github.actor }}
    #         password: ${{ secrets.GITHUB_TOKEN }}

    #     - name: Tag and push image (sha)
    #       run: |
    #         docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
    #         docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    # ---------------------------------------------------------
    # Thay vì dùng job build-and-test ta sẽ dùng những job này để có thể sử dụng parallel pattern
    # ---------------------------------------------------------
    generate-matrix:
      runs-on: ubuntu-latest
      outputs:
        matrix: ${{ steps.set-matrix.outputs.matrix }}
      steps:
        - name: Set matrix
          id: set-matrix
          run: |
            matrix="{\"os\": [\"ubuntu-latest\", \"macos-latest\", \"windows-latest\"], \"node-version\": [\"16\", \"17\", \"18\"], \"include\": [{\"os\": \"ubuntu-22.04\", \"node-version\": \"16\"}], \"exclude\": [{\"os\": \"ubuntu-latest\", \"node-version\": \"16\"}]}"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              matrix="{\"os\": [inputs.os], \"node-version\": [inputs.node-version]}"
            fi
            echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

    test:
      needs: generate-matrix
      runs-on: ${{matrix.os}}
      strategy:
        max-parallel: 2
        matrix: ${{fromJSON(needs.generate-matrix.outputs.matrix)}}
      if: github.event_name != 'schedule'
      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Setup Node.js
          uses: actions/setup-node@v3
          with:
            node-version: ${{ matrix.node-version }}
            # cache: 'npm'

        - name: Cache dependencies
          uses: actions/cache@v3
          with:
            path: |
              ~/.npm
              node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node-

        - name: Install dependencies
          run: npm ci

        - name: Run quick test
          run: |
            npm run lint:quick
            npm run test:unit

        - name: Parallel Linting and Testing
          if: github.ref == 'refs/heads/main'
          run: |
            npm run lint &
            npm run test:unit &
            npm run test:integration &
            wait

    coverage-report:
      runs-on: ${{matrix.os}}
      strategy:
        max-parallel: 2
        matrix: ${{fromJSON(needs.generate-matrix.outputs.matrix)}}
      needs: [test, generate-matrix]
      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Setup Node.js
          uses: actions/setup-node@v3
          with:
            node-version: ${{ matrix.node-version }}
            # cache: 'npm'

        - name: Cache dependencies
          uses: actions/cache@v3
          with:
            path: |
              ~/.npm
              node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node-

        - name: Install dependencies
          run: npm ci

        - name: Generate coverage report
          run: npm run test -- --coverage

        - name: Upload coverage to Codecov
          uses: codecov/codecov-action@v3
          with:
            file: ./coverage/lcov.info

    security-audit:
      needs: generate-matrix
      runs-on: ${{matrix.os}}
      strategy:
        max-parallel: 2
        matrix: ${{fromJSON(needs.generate-matrix.outputs.matrix)}}
      if: github.event_name != 'schedule'
      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Setup Node.js
          uses: actions/setup-node@v3
          with:
            node-version: ${{ matrix.node-version }}
            # cache: 'npm'

        - name: Cache dependencies
          uses: actions/cache@v3
          with:
            path: |
              ~/.npm
              node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node-

        - name: Install dependencies
          run: npm ci

        - name: Security audit
          run: npm audit --audit-level moderate

    build:
      runs-on: ${{matrix.os}}
      strategy:
        max-parallel: 2
        matrix: ${{fromJSON(needs.generate-matrix.outputs.matrix)}}
      if: github.event_name != 'schedule'
      needs: [test, coverage-report, security-audit, generate-matrix]
      outputs:
        image-tag: ${{ steps.meta.outputs.tag }}
      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Setup Node.js
          uses: actions/setup-node@v3
          with:
            node-version: ${{ matrix.node-version }}
            # cache: 'npm'

        - name: Cache dependencies
          uses: actions/cache@v3
          with:
            path: |
              ~/.npm
              node_modules
            key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-node-

        - name: Install dependencies
          run: npm ci

        - name: Set image tag
          id: meta
          run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

        - name: Build Docker image
          if: ${{ matrix.os == 'ubuntu-latest' }}
          run: |
            docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

        - name: Test Docker image
          if: ${{ matrix.os == 'ubuntu-latest' }}
          run: |
            docker run --rm -d -p 3000:3000 --name test-container ${{ env.IMAGE_NAME }}:${{ github.sha }}
            sleep 10
            curl -f http://localhost:3000/health
            docker stop test-container

        - name: Login to GitHub Container Registry
          if: ${{ matrix.os == 'ubuntu-latest' }}
          uses: docker/login-action@v2
          with:
            registry: ${{ env.DOCKER_REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Tag and push image (sha)
          if: ${{ matrix.os == 'ubuntu-latest' }}
          run: |
            docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    # ---------------------------------------------------------
    # Deploy Staging — pull image từ registry, không build lại
    # ---------------------------------------------------------
    deploy-staging:
      needs: [build, generate-matrix]
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/develop'
      steps:
        - name: Login to GitHub Container Registry
          uses: docker/login-action@v2
          with:
            registry: ${{ env.DOCKER_REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Pull image from registry
          run: docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}

        - name: Tag and push staging alias
          run: |
            docker tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }} ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:staging

        - name: Deploy to staging
          run: |
            echo "Deploying to staging environment..."
            # Ví dụ: kubectl set image deployment/app app=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}
            # Ví dụ: docker-compose -f docker-compose.staging.yml up -d

    # ---------------------------------------------------------
    # Deploy Production — pull image từ registry, không build lại
    # ---------------------------------------------------------
    deploy-production:
      needs: [build, generate-matrix]
      runs-on: ubuntu-latest
      if: |
        github.ref == 'refs/heads/main' &&
        contains(github.event.head_commit.message, '[deploy]')
      environment: production
      steps:
        - name: Login to GitHub Container Registry
          uses: docker/login-action@v2
          with:
            registry: ${{ env.DOCKER_REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Pull image from registry
          run: docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}

        - name: Tag and push latest alias
          run: |
            docker tag ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }} ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker push ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest

        - name: Show deployment configuration
          run: |
            echo "Đang tiến hành triển khai lên môi trường production"

        - name: Deploy to production
          run: |
            echo "Deploying to production environment..."
            # Ví dụ: kubectl set image deployment/app app=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-tag }}
            # Ví dụ: docker-compose -f docker-compose.prod.yml up -d

        - name: Health check
          run: |
            echo "Performing post-deployment health check..."
            # Ví dụ: curl -f https://your-app.com/health

    # ---------------------------------------------------------
    # Dọn dẹp image cũ trên GHCR (chạy định kỳ hàng tuần)
    # Không phụ thuộc vào push/PR, dùng workflow riêng bằng schedule
    # ---------------------------------------------------------
    cleanup-old-images:
      runs-on: ubuntu-latest
      if: github.event_name == 'schedule'
      steps:
        - name: Delete old untagged/old versions
          uses: actions/delete-package-versions@v4
          with:
            package-name: ${{ github.event.repository.name }}
            package-type: container
            min-versions-to-keep: 10
            delete-only-untagged-versions: false